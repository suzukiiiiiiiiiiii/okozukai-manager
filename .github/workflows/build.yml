      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install fixed Android signing keystore for in-place updates
        run: |
          mkdir -p ~/.android
          cp android_config/debug.keystore ~/.android/debug.keystore

      - name: Generate android project
        run: |
          flutter create --platforms=android --project-name okozukai_manager --org com.example .
          rm -f test/widget_test.dart
          git checkout -- lib test pubspec.yaml README.md .gitignore analysis_options.yaml

      - name: Apply AndroidManifest
        run: cp android_config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build release APK (versioned & fixed-key signed)
        run: flutter build apk --release --no-shrink --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: okozukai-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release (keeps all previous APK releases)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: お小遣い管理 APK (Build #${{ github.run_number }})
          body: |
            Android向けお小遣い管理アプリのビルド済みAPKです（Build #${{ github.run_number }}）。
            下の `app-release.apk` をスマートフォンにダウンロードしてインストールできます。
            ※このビルド以降は固定署名キーを使用しているため、次回アップデートからデータを残したまま上書きインストールできます。
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
